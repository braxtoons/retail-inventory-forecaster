server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forecast generation trains a model synchronously
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
